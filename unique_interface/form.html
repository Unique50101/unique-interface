<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unique Interface</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f6f4;color:#1b1b1b;font:16px/1.5 system-ui,sans-serif}main{max-width:780px;margin:6vh auto;padding:32px;background:white;border:1px solid #ddd;border-radius:18px}header{border-bottom:1px solid #ddd;margin-bottom:20px}header small{font-weight:700}h1{font-size:32px;line-height:1.1}.column,.row,article{display:flex;gap:12px}.column,article{flex-direction:column}.row>*{flex:1;min-width:0}label{display:grid;gap:4px;font-weight:600}input,textarea,button,pre{font:inherit;padding:9px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer}button.run,button.active{background:#191919;color:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f6f4;margin:0;min-height:44px}img,video,audio,svg{max-width:100%}nav{display:flex;gap:6px}#status{min-height:24px}article[hidden]{display:none}@media(max-width:600px){main{margin:0;padding:18px}.row{flex-direction:column}}select,summary,fieldset{font:inherit}summary{cursor:pointer}fieldset{min-width:0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:4px}td input{width:100%;min-width:3em}.dark{color-scheme:dark;background:#111;color:#eee}.dark main,.dark pre{background:#222;color:#eee}.dark button.run{background:white;color:#222}</style>
<main><header><small>Unique Interface</small><h1></h1><a href="/docs">Use via API</a></header><div id="app"></div><p id="status" role="status"></p></main>
<script type="module">
const schema=await (await fetch('/api/schema')).json(),fields=schema.fields,items=new Map();
const status=document.querySelector('#status'), el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
document.title=schema.title;document.querySelector('h1').textContent=schema.title;
const inputs=new Set(Object.values(schema.events).flatMap(e=>e.inputs));
function table(field, editable) {
 const box=el('div'), grid=el('table'), head=grid.createTHead().insertRow(), body=grid.createTBody();
 box.append(grid);
 for(const name of field.headers) head.append(el('th',name));
 function add(values){
  const row=body.insertRow();
  for(const [i,value] of values.entries()){
   const cell=row.insertCell();
   if(editable){const control=el('input');control.setAttribute('aria-label',field.headers[i]);control.value=value??'';cell.append(control)}
   else cell.textContent=value??'';
  }
  if(editable){const remove=el('button','Remove row');remove.onclick=()=>{row.remove();box.dispatchEvent(new Event('change',{bubbles:true}))};row.insertCell().append(remove)}
 }
 box.setValue=rows=>{body.replaceChildren();rows.forEach(add)};
 box.getValue=()=>Array.from(body.rows,row=>Array.from(row.querySelectorAll('input'),i=>i.value));
 if(editable){const button=el('button','Add row');button.onclick=()=>{add(field.headers.map(()=>''));box.dispatchEvent(new Event('change',{bubbles:true}))};box.append(button)}
 return box
}
function choice(field){
 if(field.type==='dropdown'){
  const select=el('select');field.choices.forEach(v=>select.add(new Option(v,v)));return select
 }
 const box=el('fieldset'),multi=field.type==='checkgroup',group=crypto.randomUUID();
 const controls=field.choices.map((v,i)=>{
  const label=el('label'),n=el('input');n.type=multi?'checkbox':'radio';n.name=group;n.value=v;n.checked=!multi&&i===0;
  label.append(n,document.createTextNode(v));box.append(label);return n
 });
 box.getValue=()=>multi?controls.filter(n=>n.checked).map(n=>n.value):controls.find(n=>n.checked)?.value;
 box.setValue=value=>controls.forEach(n=>n.checked=multi?value.includes(n.value):value===n.value);
 return box
}

function input(field){
 const kind=field.type;
 if(['barplot','scatterplot','chart'].includes(kind)){const n=el('textarea');n.getValue=()=>JSON.parse(n.value);n.setValue=v=>n.value=JSON.stringify(v);return n}
 if(['dropdown','radio','checkgroup'].includes(kind))return choice(field);
 if(kind==='dataframe')return table(field,true);
 const n=el(['text','json','code'].includes(kind)?'textarea':'input');
 if(n.tagName==='TEXTAREA')n.rows=2;
 else if(['color','number','slider','checkbox'].includes(kind)){n.type=kind==='slider'?'range':kind;for(const k of ['min','max','step'])if(k in field)n[k]=field[k]}
 else{n.type='file';if(kind!=='file')n.accept=kind+'/*'}
 return n
}
function render(node,parent){
 if(node.type==='field'){
 const f=fields[node.id],wrap=el(['dataframe','checkgroup','radio'].includes(f.type)?'fieldset':'label'),caption=el(wrap.tagName==='FIELDSET'?'legend':'span',f.label),isInput=inputs.has(node.id)||schema.bindings.some(b=>b.field===node.id),n=isInput?input(f):el('div');wrap.append(caption,n);items.set(node.id,n);parent.append(wrap);
 if(isInput&&f.type==='audio'&&navigator.mediaDevices&&window.MediaRecorder){
 const button=el('button','Record microphone');button.type='button';wrap.append(button);let rec;
 button.onclick=async e=>{e.preventDefault();try{if(rec?.state==='recording'){rec.stop();return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);const data=[];rec.ondataavailable=e=>data.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const dt=new DataTransfer();dt.items.add(new File(data,'recording.webm',{type:rec.mimeType}));n.files=dt.files;n.dispatchEvent(new Event('change',{bubbles:true}));button.textContent='Record microphone'};rec.start();button.textContent='Stop recording'}catch(err){status.textContent=err.message}}}
 }else if(node.type==='example'){
 const b=el('button','Example: '+node.values.map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' · '));b.onclick=()=>node.fields.forEach((id,i)=>show(id,node.values[i]));parent.append(b)
 }else if(node.type==='button'){const b=el('button',node.label);b.className='run';b.onclick=()=>run(node.event,b);parent.append(b)}
 else{const box=el(node.type==='accordion'?'details':node.type==='group'?'fieldset':'div');
 if(node.type==='accordion')box.append(el('summary',node.label));
 if(node.type==='group')box.append(el('legend',node.label));
 box.className=node.type;parent.append(box);let nav,panels=[],buttons=[];
 for(const child of node.children){if(child.type!=='tab'){render(child,box);continue}if(!nav){nav=el('nav');box.append(nav)}const b=el('button',child.label),panel=el('article');buttons.push(b);panels.push(panel);nav.append(b);box.append(panel);panel.hidden=panels.length>1;b.classList.toggle('active',!panel.hidden);b.onclick=()=>panels.forEach((p,i)=>{p.hidden=p!==panel;buttons[i].classList.toggle('active',p===panel)});for(const c of child.children)render(c,panel)}}}
async function read(id){
 const n=items.get(id);if(n.getValue)return n.getValue();if(n.type==='file'){const file=n.files[0];if(!file)throw Error('Choose a file first.');if(file.size>10*1024*1024)throw Error('File limit: 10 MiB.');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(file)});return {name:file.name,mime:file.type,data}}
 if(n.type==='checkbox')return n.checked;if(['number','range'].includes(n.type))return n.valueAsNumber;return fields[id].type==='json'?JSON.parse(n.value):n.value}
function show(id,value){
 const n=items.get(id),kind=fields[id].type;if(inputs.has(id)||schema.bindings.some(b=>b.field===id)){if(n.setValue)n.setValue(value);else if(n.type==='checkbox')n.checked=value;else if(n.type!=='file')n.value=kind==='json'?JSON.stringify(value):value;return}n.replaceChildren();
 if(['file','audio','video','image'].includes(kind)){if(n.dataset.url)URL.revokeObjectURL(n.dataset.url);const mime=/^(audio|video)\/[\w.+-]+$|^image\/(png|jpeg|webp|gif)$/.test(value.mime)?value.mime:'application/octet-stream';const url=URL.createObjectURL(new Blob([Uint8Array.from(atob(value.data),x=>x.charCodeAt(0))],{type:mime}));n.dataset.url=url;
 if(kind!=='file'){const media=el(kind==='image'?'img':kind);media.src=url;media.controls=true;n.append(media)}const a=el('a','Download '+value.name);a.href=url;a.download=value.name;n.append(a)}
 else if(kind==='dataframe'){const grid=table(fields[id],false);grid.setValue(value);n.append(grid)}
 else if(['chart','scatterplot','barplot'].includes(kind)){
  const canvas=el('canvas');canvas.width=600;canvas.height=180;canvas.style.maxWidth='100%';
  canvas.setAttribute('role','img');canvas.setAttribute('aria-label',fields[id].label+': '+JSON.stringify(value));
  n.append(canvas);const ctx=canvas.getContext('2d');ctx.fillStyle=ctx.strokeStyle=getComputedStyle(n).color;
  const points=kind==='scatterplot'?value:value.map((y,x)=>[x,y]);
  let xmin=0,xmax=1,ymin=0,ymax=1;
  for(const [x,y] of points){xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}
  const py=y=>172-164*(y-ymin)/(ymax-ymin);
  ctx.beginPath();
  points.forEach(([x,y],i)=>{
    const px=8+584*(x-xmin)/(xmax-xmin),v=py(y);
    if(kind==='scatterplot'){ctx.beginPath();ctx.arc(px,v,3,0,2*Math.PI);ctx.fill()}
    else if(kind==='barplot'){const w=584/points.length;ctx.fillRect(8+w*i,Math.min(v,py(0)),Math.max(1,w*.8),Math.abs(v-py(0)))}
    else if(i)ctx.lineTo(px,v);else ctx.moveTo(px,v)
  });
  if(kind==='chart')ctx.stroke()
 }else n.append(el('pre',typeof value==='string'?value:JSON.stringify(value,null,2)))}
async function run(name,button){button.disabled=true;status.textContent='Running…';try{const ev=schema.events[name],values=await Promise.all(ev.inputs.map(read));const r=await fetch('/api/'+encodeURIComponent(name),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inputs:values})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');ev.outputs.forEach((id,i)=>show(id,data.outputs[i]));status.textContent='Response time: '+data.duration_ms+' ms'}catch(e){status.textContent=e.message}finally{button.disabled=false}}
render(schema.layout,document.querySelector('#app'));
if(schema.theme==='dark'||(schema.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark');
for(const binding of schema.bindings){
 const control=items.get(binding.field);
 let busy=false;
 control.addEventListener(binding.trigger==='submit'?'keydown':'change',async e=>{
  if(binding.trigger==='submit'){if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;e.preventDefault()}
  if(busy)return;
  busy=true;try{await run(binding.event,{})}finally{busy=false}
 });
}
</script></html>
