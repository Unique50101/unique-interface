name: Verify temporary public app
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/share-smoke.yml'
      - 'unique_interface/sharing.py'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python tests/share_smoke.py
